name: Build & Release Android App

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Operation: build-and-verify (test + signed AAB/debug APK artifacts) or upload-to-play"
        required: true
        type: choice
        default: build-and-verify
        options:
          - build-and-verify
          - upload-to-play
      track:
        description: "Target Google Play track when action=upload-to-play"
        required: false
        type: choice
        default: internal
        options:
          - internal
          - alpha
          - beta
          - production
      release_status:
        description: "Play release status (completed rolls out; draft stages in Play Console)"
        required: false
        type: choice
        default: completed
        options:
          - completed
          - draft
          - inProgress
      user_fraction:
        description: "Staged rollout fraction between 0 and 1 (only when release_status=inProgress)"
        required: false
        type: string
        default: ""
      release_notes_source:
        description: "Release notes source: file (play_store_assets/RELEASE_NOTES.txt) or none"
        required: false
        type: choice
        default: file
        options:
          - file
          - none
      release_notes_language:
        description: "BCP-47 locale for release notes (default: en-US)"
        required: false
        type: string
        default: en-US
      changes_not_sent_for_review:
        description: "Stage Play edit without automatically sending for review"
        required: false
        type: boolean
        default: false
      run_tests:
        description: "Run full unit/Compose E2E tests and lintDebug before building release AAB"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: android-build-and-release
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build, Sign & Release Android App
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PYTHONWARNINGS: default
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle packages and wrapper
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml', 'build.gradle.kts', 'app/build.gradle.kts') }}
          restore-keys: |
            gradle-android-${{ runner.os }}-

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Ensure Android SDK licenses are accepted
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          fi

      - name: Run Python script unit tests
        run: python3 -W default -m unittest discover -s scripts -p "test_*.py" -v

      - name: Run Android unit/E2E tests and Lint
        if: inputs.run_tests != false
        run: sh gradlew testDebugUnitTest --rerun-tasks lintDebug

      - name: Build debug APK (for direct device testing)
        run: sh gradlew assembleDebug

      - name: Materialize release upload keystore
        id: keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::Missing repository secret UPLOAD_KEYSTORE_BASE64."
            exit 1
          fi
          ks_file="$(mktemp "${RUNNER_TEMP}/wemi-upload-XXXXXX.jks")"
          chmod 600 "$ks_file"
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$ks_file"
          echo "keystore_file=$ks_file" >> "$GITHUB_OUTPUT"

      - name: Build signed release App Bundle (.aab)
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.keystore_file }}
          STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing UPLOAD_STORE_PASSWORD or UPLOAD_KEY_PASSWORD repository secret."
            exit 1
          fi
          sh gradlew bundleRelease

      - name: Verify release App Bundle signature and pure Kotlin/DEX footprint
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          echo "=== Release AAB Signing Certificate (Public Metadata) ==="
          CERT_INFO="$(keytool -printcert -jarfile "$AAB" | grep -E 'Owner:|Valid from:|SHA1:|SHA256:')"
          printf '%s\n' "$CERT_INFO"
          {
            echo "### Signed Release App Bundle Certificate"
            echo '```text'
            printf '%s\n' "$CERT_INFO"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/upload_play_bundle.py \
            --bundle "$AAB" \
            --dry-run \
            --release-notes-source none

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wemi-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload signed release App Bundle artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wemi-release-aab
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 14

      - name: Install hash-locked Google Auth client
        if: inputs.action == 'upload-to-play'
        run: python -m pip install --quiet --require-hashes -r scripts/requirements-play.txt

      - name: Materialize Play service account credentials
        id: play_creds
        if: inputs.action == 'upload-to-play'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing repository secret PLAY_SERVICE_ACCOUNT_JSON."
            exit 1
          fi
          key_file="$(mktemp "${RUNNER_TEMP}/play-sa-XXXXXX.json")"
          chmod 600 "$key_file"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$key_file"
          echo "key_file=$key_file" >> "$GITHUB_OUTPUT"

      - name: Upload signed App Bundle to Google Play
        if: inputs.action == 'upload-to-play'
        env:
          KEY_FILE: ${{ steps.play_creds.outputs.key_file }}
          INPUT_TRACK: ${{ inputs.track }}
          INPUT_RELEASE_STATUS: ${{ inputs.release_status }}
          INPUT_USER_FRACTION: ${{ inputs.user_fraction }}
          INPUT_RELEASE_NOTES_SOURCE: ${{ inputs.release_notes_source }}
          INPUT_RELEASE_NOTES_LANGUAGE: ${{ inputs.release_notes_language }}
          INPUT_CHANGES_NOT_SENT_FOR_REVIEW: ${{ inputs.changes_not_sent_for_review }}
        run: |
          args=(
            --bundle "app/build/outputs/bundle/release/app-release.aab"
            --credentials "$KEY_FILE"
            --track "$INPUT_TRACK"
            --status "$INPUT_RELEASE_STATUS"
            --release-notes-source "$INPUT_RELEASE_NOTES_SOURCE"
            --release-notes-language "$INPUT_RELEASE_NOTES_LANGUAGE"
          )
          if [ -n "$INPUT_USER_FRACTION" ]; then
            args+=(--user-fraction "$INPUT_USER_FRACTION")
          fi
          if [ "$INPUT_CHANGES_NOT_SENT_FOR_REVIEW" = "true" ]; then
            args+=(--changes-not-sent-for-review)
          fi
          python3 scripts/upload_play_bundle.py "${args[@]}"

      - name: Clean up temporary signing and Play credentials
        if: always()
        env:
          KS_FILE: ${{ steps.keystore.outputs.keystore_file }}
          KEY_FILE: ${{ steps.play_creds.outputs.key_file }}
        run: |
          if [ -n "$KS_FILE" ]; then
            rm -f "$KS_FILE"
          fi
          if [ -n "$KEY_FILE" ]; then
            rm -f "$KEY_FILE"
          fi
