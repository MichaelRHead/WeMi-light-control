name: Promote Play Store Release

on:
  push:
    branches:
      - main
    paths:
      - "app/build.gradle.kts"
      - "RELEASE_SIGN_OFF.md"
  workflow_dispatch:
    inputs:
      mode:
        description: "Operation: list-tracks, release-status, diff-assets (read-only), sync-assets, auto-promote (Stage 7), or promote"
        required: true
        type: choice
        default: list-tracks
        options:
          - list-tracks
          - release-status
          - diff-assets
          - sync-assets
          - auto-promote
          - promote
      from_track:
        description: "Source Play track (e.g. internal, alpha, beta)"
        required: false
        type: string
        default: internal
      to_track:
        description: "Target Play track (e.g. alpha, custom closed track name, beta, production)"
        required: false
        type: string
        default: alpha
      version_code:
        description: "Optional versionCode to promote (promote mode only; blank = latest release on from_track)"
        required: false
        type: string
        default: ""
      release_status:
        description: "Target release status (completed submits/rolls out; draft stages in Play Console)"
        required: false
        type: choice
        default: completed
        options:
          - completed
          - draft
          - inProgress
      user_fraction:
        description: "Staged rollout fraction between 0 and 1 (promote mode only, when release_status is inProgress)"
        required: false
        type: string
        default: ""
      release_notes_source:
        description: "Release notes source: source_track (fallback to file), file, or none"
        required: false
        type: choice
        default: source_track
        options:
          - source_track
          - file
          - none
      release_notes_language:
        description: "BCP-47 locale for release notes and Store Listing/graphic asset sync (default: en-US)"
        required: false
        type: string
        default: en-US
      changes_not_sent_for_review:
        description: "Set true to stage changes without automatically sending for Play review"
        required: false
        type: boolean
        default: false
      allow_same_version:
        description: "Allow updating target track even if it already has the same versionCode and status (promote mode)"
        required: false
        type: boolean
        default: false
      update_sign_off:
        description: "Record Stage 7 promotion in RELEASE_SIGN_OFF.md after promoting"
        required: false
        type: boolean
        default: true
      sync_store_assets:
        description: "Also sync play_store_assets/ in the same run (default false: run sync-assets after Closed testing rollout completes)"
        required: false
        type: boolean
        default: false
      asset_image_types:
        description: "Optional comma-separated Play image types for diff-assets / sync-assets (blank = all 7)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: play-store-promote
  cancel-in-progress: false

jobs:
  play-store:
    name: Google Play Track & Asset Operation
    runs-on: ubuntu-latest
    env:
      PYTHONWARNINGS: default
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Google Auth client
        run: python -m pip install --quiet --upgrade "google-auth>=2.35.0,<3.0.0" "requests>=2.32.3,<3.0.0"

      - name: Materialize Play service account credentials
        id: creds
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::Missing repository secret PLAY_SERVICE_ACCOUNT_JSON."
              exit 1
            fi
            echo "key_file=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          key_file="$(mktemp "${RUNNER_TEMP}/play-sa-XXXXXX.json")"
          chmod 600 "$key_file"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$key_file"
          echo "key_file=$key_file" >> "$GITHUB_OUTPUT"

      - name: Run Google Play track or asset operation
        id: play
        env:
          KEY_FILE: ${{ steps.creds.outputs.key_file }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_FROM_TRACK: ${{ inputs.from_track }}
          INPUT_TO_TRACK: ${{ inputs.to_track }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          INPUT_RELEASE_STATUS: ${{ inputs.release_status }}
          INPUT_USER_FRACTION: ${{ inputs.user_fraction }}
          INPUT_RELEASE_NOTES_SOURCE: ${{ inputs.release_notes_source }}
          INPUT_RELEASE_NOTES_LANGUAGE: ${{ inputs.release_notes_language }}
          INPUT_CHANGES_NOT_SENT_FOR_REVIEW: ${{ inputs.changes_not_sent_for_review }}
          INPUT_ALLOW_SAME_VERSION: ${{ inputs.allow_same_version }}
          INPUT_ASSET_IMAGE_TYPES: ${{ inputs.asset_image_types }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            MODE="auto-promote"
            FROM_TRACK="internal"
            TO_TRACK="alpha"
            RELEASE_STATUS="completed"
            NOTES_SOURCE="source_track"
            NOTES_LANG="en-US"
            CHANGES_NOT_SENT="false"
            ASSET_TYPES=""
          else
            MODE="$INPUT_MODE"
            FROM_TRACK="$INPUT_FROM_TRACK"
            TO_TRACK="$INPUT_TO_TRACK"
            RELEASE_STATUS="$INPUT_RELEASE_STATUS"
            NOTES_SOURCE="$INPUT_RELEASE_NOTES_SOURCE"
            NOTES_LANG="$INPUT_RELEASE_NOTES_LANGUAGE"
            CHANGES_NOT_SENT="$INPUT_CHANGES_NOT_SENT_FOR_REVIEW"
            ASSET_TYPES="$INPUT_ASSET_IMAGE_TYPES"
          fi

          if [ "$MODE" = "list-tracks" ]; then
            python3 scripts/promote_play_release.py \
              --credentials "$KEY_FILE" \
              --github-output "$GITHUB_OUTPUT" \
              list-tracks
          elif [ "$MODE" = "release-status" ]; then
            args=(
              --credentials "$KEY_FILE"
              --github-output "$GITHUB_OUTPUT"
              release-status
              --track "$TO_TRACK"
            )
            if [ -n "$INPUT_VERSION_CODE" ]; then
              args+=(--version-code "$INPUT_VERSION_CODE")
            fi
            python3 scripts/promote_play_release.py "${args[@]}"
          elif [ "$MODE" = "diff-assets" ] || [ "$MODE" = "sync-assets" ]; then
            echo "promoted=false" >> "$GITHUB_OUTPUT"
            args=(
              --credentials "$KEY_FILE"
              --github-output "$GITHUB_OUTPUT"
              "$MODE"
              --language "$NOTES_LANG"
            )
            if [ -n "$ASSET_TYPES" ]; then
              args+=(--image-types "$ASSET_TYPES")
            fi
            if [ "$MODE" = "sync-assets" ] && [ "$CHANGES_NOT_SENT" = "true" ]; then
              args+=(--changes-not-sent-for-review)
            fi
            python3 scripts/sync_play_assets.py "${args[@]}"
          elif [ "$MODE" = "auto-promote" ]; then
            CURR_VC="$(python3 -c 'import pathlib, sys; sys.path.insert(0, "scripts"); import promote_play_release as m; v = m.parse_gradle_version_code(pathlib.Path("app/build.gradle.kts").read_text(encoding="utf-8")); print("" if v is None else v)')"
            PREV_VC=""
            if [ "$EVENT_NAME" = "push" ]; then
              BEFORE_REF="$EVENT_BEFORE"
              if [ -z "$BEFORE_REF" ] || [ "$BEFORE_REF" = "0000000000000000000000000000000000000000" ]; then
                BEFORE_REF="HEAD~1"
              fi
              SIGN_OFF_CHANGED="false"
              if git diff --name-only "$BEFORE_REF" HEAD -- RELEASE_SIGN_OFF.md 2>/dev/null | grep -qx "RELEASE_SIGN_OFF.md"; then
                SIGN_OFF_CHANGED="true"
              fi
              if PREV_GRADLE="$(git show "${BEFORE_REF}:app/build.gradle.kts" 2>/dev/null)"; then
                RAW_PREV_VC="$(printf '%s' "$PREV_GRADLE" | python3 -c 'import sys; sys.path.insert(0, "scripts"); import promote_play_release as m; v = m.parse_gradle_version_code(sys.stdin.read()); print("" if v is None else v)')"
                if [ -n "$RAW_PREV_VC" ]; then
                  if [ "$SIGN_OFF_CHANGED" != "true" ] || { [ -n "$CURR_VC" ] && [ "$RAW_PREV_VC" -lt "$CURR_VC" ]; }; then
                    PREV_VC="$RAW_PREV_VC"
                  fi
                fi
              fi
            fi

            args=(
              --credentials "$KEY_FILE"
              --github-output "$GITHUB_OUTPUT"
              auto-promote
              --from-track "$FROM_TRACK"
              --to-track "$TO_TRACK"
              --status "$RELEASE_STATUS"
              --release-notes-source "$NOTES_SOURCE"
              --release-notes-language "$NOTES_LANG"
            )
            if [ -n "$CURR_VC" ]; then
              args+=(--current-version-code "$CURR_VC")
            fi
            if [ -n "$PREV_VC" ]; then
              args+=(--previous-version-code "$PREV_VC")
            fi
            if [ "$CHANGES_NOT_SENT" = "true" ]; then
              args+=(--changes-not-sent-for-review)
            fi
            python3 scripts/promote_play_release.py "${args[@]}"
          else
            args=(
              --credentials "$KEY_FILE"
              --github-output "$GITHUB_OUTPUT"
              promote
              --from-track "$FROM_TRACK"
              --to-track "$TO_TRACK"
              --status "$RELEASE_STATUS"
              --release-notes-source "$NOTES_SOURCE"
              --release-notes-language "$NOTES_LANG"
            )
            if [ -n "$INPUT_VERSION_CODE" ]; then
              args+=(--version-code "$INPUT_VERSION_CODE")
            fi
            if [ -n "$INPUT_USER_FRACTION" ]; then
              args+=(--user-fraction "$INPUT_USER_FRACTION")
            fi
            if [ "$CHANGES_NOT_SENT" = "true" ]; then
              args+=(--changes-not-sent-for-review)
            fi
            if [ "$INPUT_ALLOW_SAME_VERSION" = "true" ]; then
              args+=(--allow-same-version)
            fi
            python3 scripts/promote_play_release.py "${args[@]}"
          fi

      - name: Record Stage 7 promotion in RELEASE_SIGN_OFF.md
        if: steps.play.outputs.promoted == 'true' && (github.event_name == 'push' || inputs.update_sign_off == true)
        env:
          PROMOTED_VC: ${{ steps.play.outputs.version_code }}
          PROMOTED_NAME: ${{ steps.play.outputs.release_name }}
          FROM_TRACK: ${{ steps.play.outputs.from_track }}
          TO_TRACK: ${{ steps.play.outputs.to_track }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name "Antigravity App Promoter Agent"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          NAME_SUFFIX=""
          if [ -n "${PROMOTED_NAME}" ]; then
            NAME_SUFFIX=" release ${PROMOTED_NAME}"
          fi
          bash scripts/advance_release_turn.sh promote \
            "Promoted Play build ${PROMOTED_VC}${NAME_SUFFIX} from ${FROM_TRACK} to ${TO_TRACK} via GitHub Actions run ${RUN_ID}." \
            --version-code "${PROMOTED_VC}" \
            --from-track "${FROM_TRACK}" \
            --track "${TO_TRACK}" \
            --verified "Play API promotion succeeded; build ${PROMOTED_VC} live on ${TO_TRACK}"

      - name: Sync Play Store listing and graphic assets (opt-in inline; default is post-rollout mode=sync-assets)
        if: steps.play.outputs.promoted == 'true' && github.event_name != 'push' && inputs.sync_store_assets == true
        env:
          KEY_FILE: ${{ steps.creds.outputs.key_file }}
          INPUT_RELEASE_NOTES_LANGUAGE: ${{ inputs.release_notes_language }}
          INPUT_CHANGES_NOT_SENT_FOR_REVIEW: ${{ inputs.changes_not_sent_for_review }}
          INPUT_ASSET_IMAGE_TYPES: ${{ inputs.asset_image_types }}
        run: |
          LANG="${INPUT_RELEASE_NOTES_LANGUAGE:-en-US}"
          args=(
            --credentials "$KEY_FILE"
            --github-output "$GITHUB_OUTPUT"
            sync-assets
            --language "$LANG"
          )
          if [ -n "$INPUT_ASSET_IMAGE_TYPES" ]; then
            args+=(--image-types "$INPUT_ASSET_IMAGE_TYPES")
          fi
          if [ "$INPUT_CHANGES_NOT_SENT_FOR_REVIEW" = "true" ]; then
            args+=(--changes-not-sent-for-review)
          fi
          python3 scripts/sync_play_assets.py "${args[@]}"

      - name: Clean up temporary credentials
        if: always() && steps.creds.outputs.key_file != ''
        env:
          KEY_FILE: ${{ steps.creds.outputs.key_file }}
        run: rm -f "$KEY_FILE"
