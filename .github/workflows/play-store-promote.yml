name: Promote Play Store Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Operation: list-tracks (read-only) or promote"
        required: true
        type: choice
        default: list-tracks
        options:
          - list-tracks
          - promote
      from_track:
        description: "Source Play track (e.g. internal, alpha, beta)"
        required: false
        type: string
        default: internal
      to_track:
        description: "Target Play track (e.g. alpha, custom closed track name, beta, production)"
        required: false
        type: string
        default: alpha
      version_code:
        description: "Optional versionCode to promote (blank = latest release on from_track)"
        required: false
        type: string
        default: ""
      release_status:
        description: "Target release status (completed submits/rolls out; draft stages in Play Console)"
        required: false
        type: choice
        default: completed
        options:
          - completed
          - draft
          - inProgress
      user_fraction:
        description: "Staged rollout fraction between 0 and 1 (only when release_status is inProgress)"
        required: false
        type: string
        default: ""
      release_notes_source:
        description: "Release notes source: source_track (fallback to file), file, or none"
        required: false
        type: choice
        default: source_track
        options:
          - source_track
          - file
          - none
      release_notes_language:
        description: "BCP-47 language code for file release notes (default: en-US)"
        required: false
        type: string
        default: en-US
      changes_not_sent_for_review:
        description: "Set true to stage changes without automatically sending for Play review"
        required: false
        type: boolean
        default: false
      allow_same_version:
        description: "Allow updating target track even if it already has the same versionCode and status"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: play-store-promote
  cancel-in-progress: false

jobs:
  play-store:
    name: Google Play Track Operation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Google Auth client
        run: python -m pip install --quiet --upgrade google-auth requests

      - name: Materialize Play service account credentials
        id: creds
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing repository secret PLAY_SERVICE_ACCOUNT_JSON."
            exit 1
          fi
          key_file="$(mktemp "${RUNNER_TEMP}/play-sa-XXXXXX.json")"
          chmod 600 "$key_file"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$key_file"
          echo "key_file=$key_file" >> "$GITHUB_OUTPUT"

      - name: Run Google Play track operation
        env:
          KEY_FILE: ${{ steps.creds.outputs.key_file }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_FROM_TRACK: ${{ inputs.from_track }}
          INPUT_TO_TRACK: ${{ inputs.to_track }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          INPUT_RELEASE_STATUS: ${{ inputs.release_status }}
          INPUT_USER_FRACTION: ${{ inputs.user_fraction }}
          INPUT_RELEASE_NOTES_SOURCE: ${{ inputs.release_notes_source }}
          INPUT_RELEASE_NOTES_LANGUAGE: ${{ inputs.release_notes_language }}
          INPUT_CHANGES_NOT_SENT_FOR_REVIEW: ${{ inputs.changes_not_sent_for_review }}
          INPUT_ALLOW_SAME_VERSION: ${{ inputs.allow_same_version }}
        run: |
          if [ "$INPUT_MODE" = "list-tracks" ]; then
            python3 scripts/promote_play_release.py \
              --credentials "$KEY_FILE" \
              list-tracks
          else
            args=(
              --credentials "$KEY_FILE"
              promote
              --from-track "$INPUT_FROM_TRACK"
              --to-track "$INPUT_TO_TRACK"
              --status "$INPUT_RELEASE_STATUS"
              --release-notes-source "$INPUT_RELEASE_NOTES_SOURCE"
              --release-notes-language "$INPUT_RELEASE_NOTES_LANGUAGE"
            )
            if [ -n "$INPUT_VERSION_CODE" ]; then
              args+=(--version-code "$INPUT_VERSION_CODE")
            fi
            if [ -n "$INPUT_USER_FRACTION" ]; then
              args+=(--user-fraction "$INPUT_USER_FRACTION")
            fi
            if [ "$INPUT_CHANGES_NOT_SENT_FOR_REVIEW" = "true" ]; then
              args+=(--changes-not-sent-for-review)
            fi
            if [ "$INPUT_ALLOW_SAME_VERSION" = "true" ]; then
              args+=(--allow-same-version)
            fi
            python3 scripts/promote_play_release.py "${args[@]}"
          fi

      - name: Clean up temporary credentials
        if: always() && steps.creds.outputs.key_file != ''
        env:
          KEY_FILE: ${{ steps.creds.outputs.key_file }}
        run: rm -f "$KEY_FILE"
